
name: Update streak stats

on:
  schedule:
    - cron: "0 3 * * *"

  workflow_dispatch:

  push:
    paths:
      - ".github/workflows/streak-stats.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Generate dark mode streak stats
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          options: user=${{ github.repository_owner }}&theme=github-dark&hide_border=true&short_numbers=false&disable_animations=true
          path: profile/streak-dark.svg

      - name: Generate light mode streak stats
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          options: user=${{ github.repository_owner }}&theme=github-light&hide_border=true&short_numbers=false&disable_animations=true
          path: profile/streak-light.svg


      - name: Commit updated streak image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/streak.svg
          git commit -m "Update streak stats" || exit 0
          git push
